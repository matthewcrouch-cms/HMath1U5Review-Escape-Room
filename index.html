<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lockdown at the Whitewater Center: Unit 5 Escape Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF2F9; --ink:#0B1B33; --muted:#46607F; --panel:#FFFFFF; --line:#B9CCDD;
  --blue:#1F6FB2; --blue-soft:#DCEBF7; --orange:#F56600; --orange-text:#B84700;
  --good:#17794A; --bad:#B3261E; --focus:#0B1B33; --btn-ink:#0B1B33;
  --pad-bg:#06101F; --pad-line:#27456E; --pad-slot:#0B1B33; --pad-off:#4A6285; --pad-on:#8FD0FF; --pad-ink:#F2F7FB; --pad-muted:#9DB4CD;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#081528; --ink:#F2F7FB; --muted:#9DB4CD; --panel:#10264A; --line:#27456E;
    --blue:#6BB0E0; --blue-soft:#16345F; --orange-text:#FF8A3D;
    --good:#5FD39A; --bad:#FF8A80; --focus:#F2F7FB; --btn-ink:#F2F7FB;
  }
}
:root[data-theme="dark"]{
  --bg:#081528; --ink:#F2F7FB; --muted:#9DB4CD; --panel:#10264A; --line:#27456E;
  --blue:#6BB0E0; --blue-soft:#16345F; --orange-text:#FF8A3D;
  --good:#5FD39A; --bad:#FF8A80; --focus:#F2F7FB; --btn-ink:#F2F7FB;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-size:17px; line-height:1.45}
h1,h2,h3{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif; line-height:1.1; margin:0}
button,input{font:inherit; color:inherit}
i{font-style:italic}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
#app{min-height:100%; display:flex; flex-direction:column}
.wrap{width:100%; max-width:1020px; margin:0 auto; padding:0 20px 48px}

/* buttons */
.btn{font-weight:700; padding:.65rem 1.1rem; border-radius:10px; cursor:pointer; border:2px solid currentColor; background:transparent; color:var(--btn-ink)}
.btn:hover{background:var(--blue-soft)}
.btn.primary{background:var(--orange); border-color:var(--orange); color:#0B1B33; font-weight:800}
.btn.primary:hover{background:#FF7A21}
.btn.small{padding:.35rem .8rem; font-size:.95rem}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.btn.ghost{font-weight:600}

/* hud */
.hud{display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:12px 20px; max-width:1020px; width:100%; margin:0 auto}
.hud[hidden]{display:none}
.hud-title{font-family:"Bricolage Grotesque",sans-serif; font-weight:700; flex:1; min-width:180px}
.hud-stats{display:flex; gap:16px; color:var(--muted); font-weight:600}
.hud-stats b{color:var(--ink); font-variant-numeric:tabular-nums}

/* keypad device */
.keypad{background:var(--pad-bg); color:var(--pad-ink); border:2px solid var(--pad-line); border-radius:18px; padding:18px 22px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap}
.keypad p{margin:0; color:var(--pad-muted); font-weight:600; max-width:22ch}
.slots{display:flex; gap:10px}
.slot{width:clamp(44px,9vw,74px); height:clamp(60px,12vw,94px); border-radius:10px; background:var(--pad-slot); border:2px solid var(--pad-line); display:grid; place-items:center; font-family:"Space Mono",ui-monospace,monospace; font-weight:700; font-size:clamp(1.8rem,5vw,3.1rem); color:var(--pad-off)}
.slot.on{color:var(--pad-on); border-color:#4B9CD3; text-shadow:0 0 16px rgba(111,190,240,.55)}

/* start */
.hero{padding:6vh 0 3vh; display:grid; gap:22px}
.hero h1{font-size:clamp(2.3rem,7vw,4.6rem); font-weight:800; letter-spacing:-.02em; max-width:12ch}
.hero .sub{font-size:1.15rem; color:var(--muted); margin:0; max-width:46ch}
.story{max-width:56ch; margin:0}
.panel{background:var(--panel); border:2px solid var(--line); border-radius:14px; padding:20px}
.start-form{display:grid; gap:12px; max-width:460px}
.start-form label{font-weight:700}
.txt{width:100%; padding:.7rem .9rem; border-radius:10px; border:2px solid var(--line); background:var(--bg); color:var(--ink)}
.rules{margin:0; padding-left:1.2rem; display:grid; gap:4px; max-width:56ch; color:var(--muted)}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}

/* hub */
.hub-head{display:grid; gap:6px; padding:8px 0 18px}
.hub-head h2{font-size:clamp(1.6rem,3.6vw,2.4rem)}
.hub-head p{margin:0; color:var(--muted); max-width:60ch}
.rooms{display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:14px; margin-top:18px}
.room{background:var(--panel); border:2px solid var(--line); border-left:8px solid var(--orange); border-radius:14px; padding:16px 18px; display:grid; gap:10px; align-content:start}
.room.done{border-left-color:var(--blue)}
.room h3{font-size:1.35rem}
.room .topic{margin:0; color:var(--muted)}
.segs{list-style:none; margin:0; padding:0; display:flex; gap:6px}
.segs li{flex:1; height:10px; border-radius:5px; background:var(--line)}
.segs li.d{background:var(--blue)}
.segs li.c{background:var(--orange)}
.room-foot{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap}
.status{font-weight:700; color:var(--muted)}
.status.ok{color:var(--blue)}
.door-card{margin-top:14px; display:flex; gap:14px; align-items:center; justify-content:space-between; flex-wrap:wrap}
.door-card h3{font-size:1.35rem}
.door-card p{margin:2px 0 0; color:var(--muted)}

/* room */
.room-head{display:grid; gap:8px; padding:6px 0 16px}
.room-head h2{font-size:clamp(1.6rem,3.6vw,2.4rem)}
.room-head .story{color:var(--muted)}
.prog{display:flex; align-items:center; gap:12px}
.prog .segs{flex:1; max-width:340px}
.prog span{font-weight:700; color:var(--muted)}
.qcard{display:grid; gap:16px}
.qcard .prompt{margin:0; font-size:1.2rem; line-height:1.5}
.qgrid{display:grid; gap:20px; grid-template-columns:1fr}
.qgrid.has-fig{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); align-items:start}
.fig{margin:0; background:#fff; color:#0B1B33; border-radius:12px; padding:10px; text-align:center}
.fig img{display:block; width:100%; max-width:560px; height:auto; margin:0 auto}
.fig figcaption{font-size:.9rem; color:#46607F; margin-top:6px}
fieldset{border:0; margin:0; padding:0; display:grid; gap:10px; min-width:0}
.opt{display:flex; gap:12px; align-items:flex-start; padding:.8rem 1rem; border:2px solid var(--line); border-radius:12px; background:var(--panel); cursor:pointer}
.opt:hover{border-color:var(--blue)}
.opt:has(input:checked){border-color:var(--blue); background:var(--blue-soft)}
.opt input{margin-top:.3rem; width:1.15rem; height:1.15rem; accent-color:var(--blue); flex:none}
.opt.right{border-color:var(--good); background:transparent}
.opt.right::after{content:"Correct answer"; margin-left:auto; font-weight:800; color:var(--good); font-size:.9rem; white-space:nowrap}
.opt.disabled{cursor:default}
.hintline{margin:0; color:var(--muted); font-weight:600}
.answer-input{display:grid; gap:6px; max-width:420px}
.answer-input label{font-weight:700}
.fb{border-radius:12px; padding:.9rem 1.1rem; background:var(--panel); border:2px solid var(--line); border-left-width:8px}
.fb p{margin:0 0 6px}
.fb p:last-child{margin-bottom:0}
.fb.bad{border-left-color:var(--bad)}
.fb.good,.fb.reveal{border-left-color:var(--good)}
.fb.nudge{border-left-color:var(--orange)}
.fb strong.t{display:block; font-family:"Bricolage Grotesque",sans-serif; font-size:1.15rem; margin-bottom:4px}
.fb.bad strong.t{color:var(--bad)} .fb.good strong.t,.fb.reveal strong.t{color:var(--good)}
.cracked{display:grid; gap:18px; justify-items:start; padding:4vh 0}
.cracked h2{font-size:clamp(2rem,5vw,3.4rem)}
.cracked .slot{width:96px; height:128px; font-size:4rem}
.cracked p{margin:0; max-width:50ch; color:var(--muted)}

/* door + escaped */
.door{display:grid; gap:18px; padding:2vh 0}
.door h2{font-size:clamp(1.8rem,4vw,2.8rem)}
.code-input{font-family:"Space Mono",ui-monospace,monospace; font-weight:700; font-size:2.2rem; letter-spacing:.45em; text-align:center; max-width:380px; padding-left:.9rem}
.cert{background:var(--pad-bg); color:var(--pad-ink); border:2px solid var(--pad-line); border-radius:18px; padding:clamp(20px,4vw,36px); display:grid; gap:14px}
.cert h2{font-size:clamp(2.2rem,6vw,4rem); color:var(--pad-on)}
.cert .who{font-size:1.4rem; font-weight:700}
.cert dl{margin:0; display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px}
.cert dt{color:var(--pad-muted); font-weight:600}
.cert dd{margin:0; font-family:"Space Mono",monospace; font-weight:700; font-size:1.6rem}
.stars{font-size:2rem; color:#FFB066; letter-spacing:.1em}
.cert p{margin:0; color:var(--pad-muted)}

@media (max-width:760px){
  .qgrid.has-fig{grid-template-columns:1fr}
  .wrap{padding:0 14px 40px}
}
@media (prefers-reduced-motion:no-preference){
  .slot.pop{animation:pop .35s ease-out}
  @keyframes pop{from{transform:scale(.8); opacity:.2}to{transform:none; opacity:1}}
}
</style>
</head>
<body>
<div id="app">
  <header class="hud" id="hud" hidden>
    <button class="btn small" id="btnMap" hidden>Back to the map</button>

    <div class="hud-stats">
      <span>Time <b id="clock">0:00</b></span>
      <span>Alarms <b id="alarms">0</b></span>
    </div>
  </header>
  <main class="wrap" id="view"></main>
</div>

/* ---------- helpers ---------- */
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function I(x){ return '<i>' + x + '</i>'; }
function N(n){ return n.toLocaleString('en-US'); }
function ordinal(n){ var s = ['th','st','nd','rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
function mmss(sec){ var m = Math.floor(sec / 60), s = sec % 60; return m + ':' + (s < 10 ? '0' : '') + s; }

function mulberry(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function R(seed){
  var f = mulberry(seed);
  return {
    int:function(a, b){ return a + Math.floor(f() * (b - a + 1)); },
    pick:function(arr){ return arr[Math.floor(f() * arr.length)]; },
    shuffle:function(arr){
      var a = arr.slice();
      for(var i = a.length - 1; i > 0; i--){ var j = Math.floor(f() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
      return a;
    }
  };
}
function mc(r, correct, wrong, keepOrder){
  var items = [{l:correct, ok:true}].concat(wrong.map(function(w){ return {l:w, ok:false}; }));
  if(!keepOrder) items = r.shuffle(items);
  var opts = [], cid = null;
  items.forEach(function(it, i){ var id = 'o' + i; opts.push({id:id, label:it.l}); if(it.ok) cid = id; });
  return {options:opts, correct:cid};
}
function multi(statements){
  var opts = [], cor = [];
  statements.forEach(function(s, i){ var id = 's' + i; opts.push({id:id, label:s.l}); if(s.ok) cor.push(id); });
  return {options:opts, correct:cor};
}
function normText(s){ return String(s).toLowerCase().replace(/[\s,]/g, '').replace(/\u2212/g, '-').replace(/\.$/, ''); }
function parseNum(s){
  var t = String(s).replace(/[$,\s]/g, '').replace(/\u2212/g, '-');
  if(!/^-?\d+(\.\d+)?$/.test(t)) return null;
  return parseFloat(t);
}
function eqAccept(a, b){ return [normText(a + '=' + b), normText(b + '=' + a)]; }

/* ---------- question generators ---------- */
var NOTATION_HINT = 'Write the function name, then the input in parentheses, then an equals sign and the output.';

function qPuppy(r){
  var a = r.int(4, 14), w = r.int(24, 78);
  var m = mc(r, 'The puppy weighs ' + w + ' pounds when it is ' + a + ' months old.', [
    'The puppy weighs ' + a + ' pounds when it is ' + w + ' months old.',
    'The puppy weighs ' + w + ' pounds when it is ' + a + ' days old.',
    'The weight of the puppy has been ' + w + ' pounds for ' + a + ' months.'
  ]);
  return {kind:'mc', options:m.options, correct:m.correct,
    prompt:'Function ' + I('p') + ' gives the weight of a puppy, in pounds, when it is ' + I('m') + ' months old. Which statement represents the meaning of ' + I('p') + '(' + a + ') = ' + w + '?',
    hints:['In ' + I('p') + '(' + a + ') = ' + w + ', the number in parentheses is the input and the number after the equals sign is the output.',
           'Here the input is the puppy’s age in months and the output is its weight in pounds.'],
    explain:'The input ' + a + ' is the age in months and the output ' + w + ' is the weight in pounds, so the puppy weighs ' + w + ' pounds at ' + a + ' months old.'};
}
function qDriver(r){
  var h = r.int(2, 9), k = r.int(4, 18) * 10;
  var m = mc(r, 'After ' + h + ' hours, the driver has driven ' + k + ' kilometers.', [
    'After ' + k + ' hours, the driver has driven ' + h + ' kilometers.',
    'The driver drives ' + k + ' kilometers every ' + h + ' hours.',
    'The driver drove for ' + h + ' hours at ' + k + ' kilometers per hour.'
  ]);
  return {kind:'mc', options:m.options, correct:m.correct,
    prompt:'Function ' + I('K') + ' gives the number of kilometers driven by an Amazon driver after ' + I('h') + ' hours. What does ' + I('K') + '(' + h + ') = ' + k + ' mean?',
    hints:['The input is inside the parentheses. Ask yourself what quantity the input measures.',
           'The input ' + h + ' is hours. The output ' + k + ' is total kilometers driven, not a rate.'],
    explain:'The input ' + h + ' is the number of hours and the output ' + k + ' is the total kilometers driven by then.'};
}
function qInequality(r){
  var m = mc(r, 'City A has a greater population than City B, ' + 't years after 1990.', [
    'City B has a greater population than City A, t years after 1990.',
    'City A and City B have the same population t years after 1990.',
    'City A’s population is growing faster than City B’s.'
  ]);
  return {kind:'mc', options:m.options, correct:m.correct,
    prompt:'Functions ' + I('A') + ' and ' + I('B') + ' give the populations of City A and City B, in millions, ' + I('t') + ' years since 1990. What does ' + I('A') + '(' + I('t') + ') &gt; ' + I('B') + '(' + I('t') + ') mean?',
    hints:['A(t) and B(t) are the outputs: the two populations at the same time t.',
           'The symbol &gt; opens toward the larger value, so the population on the left is bigger.'],
    explain:I('A') + '(' + I('t') + ') &gt; ' + I('B') + '(' + I('t') + ') compares the two populations at the same time. City A’s population is greater at that time. It says nothing about how fast either one is growing.'};
}

function qNotationK(r){
  var h = r.int(3, 12), k = r.int(4, 60) * 50;
  return {kind:'text', accept:eqAccept('K(' + h + ')', k), display:'K(' + h + ') = ' + N(k),
    placeholder:'Example format: K(4) = 90',
    prompt:'Function ' + I('K') + ' gives the kilometers driven by an Amazon driver after ' + I('h') + ' hours. Use function notation to represent this statement: after driving for ' + h + ' hours, the driver had driven ' + N(k) + ' kilometers.',
    hints:[NOTATION_HINT, 'The input is the number of hours (' + h + '). The output is the number of kilometers (' + N(k) + ').'],
    explain:'Input ' + h + ' goes in the parentheses and output ' + N(k) + ' goes after the equals sign: ' + I('K') + '(' + h + ') = ' + N(k) + '.'};
}
function qNotationMore(r){
  var a = r.int(7, 12), b = r.int(2, 5);
  var m = mc(r, 'p(' + a + ') > p(' + b + ')', ['p(' + b + ') > p(' + a + ')', 'p(' + a + ') = p(' + b + ')', a + ' > ' + b]);
  return {kind:'mc', options:m.options, correct:m.correct,
    prompt:'Function ' + I('p') + ' gives a puppy’s weight, in pounds, at ' + I('m') + ' months old. Which statement in function notation says the puppy weighed more at ' + a + ' months than at ' + b + ' months?',
    hints:['“Weighed more” compares weights, which are outputs of the function.',
           'Put each age inside ' + I('p') + '( ) so you are comparing the weights, then decide which weight is bigger.'],
    explain:'Weights are the outputs, so compare ' + I('p') + '(' + a + ') with ' + I('p') + '(' + b + '). The ' + a + '-month weight is larger: ' + I('p') + '(' + a + ') &gt; ' + I('p') + '(' + b + ').'};
}
function qNotationSame(r){
  var t = r.int(4, 9);
  return {kind:'text', accept:eqAccept('A(' + t + ')', 'B(' + t + ')'), display:'A(' + t + ') = B(' + t + ')',
    placeholder:'Example format: A(2) = B(2)',
    prompt:'Functions ' + I('A') + ' and ' + I('B') + ' give the populations of City A and City B, ' + I('t') + ' years since 1990. Write one equation in function notation that says the two cities had the same population ' + t + ' years after 1990.',
    hints:['Both functions use the same input, so the same number goes inside both sets of parentheses.',
           'Write A of that number, an equals sign, then B of that number.'],
    explain:'Same population means equal outputs at the same input: ' + I('A') + '(' + t + ') = ' + I('B') + '(' + t + ').'};
}

function qBallSelect(){

function qCitiesEqual(r){

function qWhitewater(r){
  var L = r.pick(['66.5','68.5','71.5','72.5','74.5']), H = r.pick(['95.8','97.3','99.3','101.2']), P = r.pick([8000, 10000, 12000, 15000]);
  var Hr = String(Math.round(parseFloat(H)));
  var good = 'Domain: all real numbers from ' + L + ' to ' + H + '. Range: all whole numbers from 0 to ' + N(P) + '.';
  var m = mc(r, good, [
    'Domain: all real numbers from ' + L + ' to ' + Hr + '. Range: all real numbers from 0 to ' + N(P) + '.',
    'Domain: all whole numbers from ' + L + ' to ' + Hr + '. Range: all whole numbers from 0 to ' + N(P) + '.',
    'Domain: all real numbers from 0 to ' + H + '. Range: all whole numbers from 0 to ' + N(P) + '.'
  ]);
  return {kind:'mc', options:m.options, correct:m.correct,
    prompt:'Function ' + I('W') + ' gives the number of people at the Whitewater Center as a function of the day’s high temperature, ' + I('t') + '. Last summer, high temperatures went from a low of ' + L + '°F to a high of ' + H + '°F, and the peak number of people on any day was ' + N(P) + '. Which domain and range make sense for ' + I('W') + '?',
    hints:['The domain is the set of possible inputs (temperatures). The range is the set of possible outputs (people). Decide which can be decimals.',
           'Temperatures can be decimals, but people are counted in whole numbers. The domain starts at the lowest temperature, not 0.'],
    explain:'Temperatures between ' + L + ' and ' + H + ' can be any decimal, so the domain is all real numbers in that interval. People are counted in whole numbers from 0 up to the peak of ' + N(P) + '.'};
}
function qBallDomainRange(r){
  var m = mc(r, 'Domain: 0 ≤ t ≤ 2.4. Range: 0 ≤ h ≤ 2.', [
    'Domain: 0 ≤ t ≤ 2. Range: 0 ≤ h ≤ 2.4.',
    'Domain: 0.4 ≤ t ≤ 2.4. Range: 0.5 ≤ h ≤ 2.',
    'Domain: all real numbers. Range: all real numbers.'
  ]);
  return {kind:'mc', options:m.options, correct:m.correct, fig:'ball',
    prompt:'The graph shows the height ' + I('h') + ', in meters, of a bouncing ball ' + I('t') + ' seconds after it is dropped. For the portion of the graph that is shown, which domain and range make sense?',
    hints:['Domain is the horizontal extent of the graph (time). Range is the vertical extent (height).',
           'The graph starts at time 0 and ends near 2.4 seconds. The height is never below 0 or above 2 meters.'],
    explain:'The graph runs from ' + I('t') + ' = 0 to about 2.4 seconds (domain), and the height stays between 0 and 2 meters (range).'};
}
function qDonutDomain(r){
  var u = r.pick([40, 50, 60, 75, 80]), days = r.int(15, 30), S = u * days;
  return {kind:'num', answer:days, display:String(days), placeholder:'Type a number of days',
    prompt:'A donut shop owner bought ' + N(S) + ' pounds of flour and uses ' + u + ' pounds each day. Function ' + I('f') + '(' + I('d') + ') = ' + N(S) + ' − ' + u + I('d') + ' gives the pounds of flour remaining after ' + I('d') + ' days. The flour cannot go below 0 pounds. What is the greatest value of ' + I('d') + ' that makes sense in the domain?',
    hints:['The last day that makes sense is when no flour is left. Set ' + I('f') + '(' + I('d') + ') equal to 0.',
           'Solve ' + N(S) + ' − ' + u + I('d') + ' = 0 for ' + I('d') + '.'],
    explain:N(S) + ' − ' + u + I('d') + ' = 0 gives ' + I('d') + ' = ' + days + '. The domain is 0 ≤ ' + I('d') + ' ≤ ' + days + '.'};
}

function qRental(r){
  var a = r.pick([35, 40, 45, 50, 55, 60]), b = r.pick([20, 25, 30, 35, 40]), w = r.pick([2, 3]), d = 7 * w, ans = a * d + b;
  return {kind:'num', answer:ans, display:'$' + N(ans), placeholder:'Type a dollar amount',
    prompt:'The total cost, in dollars, of renting a car is given by ' + I('r') + '(' + I('d') + ') = ' + a + I('d') + ' + ' + b + ', where ' + I('d') + ' is the number of days the car is rented. How much, in dollars, does it cost to rent the car for ' + w + ' weeks?',
    hints:['The input ' + I('d') + ' is in days. How many days are in ' + w + ' weeks?',
           'Substitute ' + d + ' for ' + I('d') + ' and evaluate.'],
    explain:w + ' weeks is ' + d + ' days. ' + I('r') + '(' + d + ') = ' + a + '(' + d + ') + ' + b + ' = ' + N(ans) + ', so the cost is $' + N(ans) + '.'};
}
function qTermSum(r){
  var c = r.pick([3, 4, 5, 6, 7]), e = r.int(1, 4), i = r.int(2, 5), j = r.int(6, 10);
  var bi = c * i + e, bj = c * j + e;
  return {kind:'num', answer:bi + bj, display:String(bi + bj), placeholder:'Type a number',
    prompt:'The function ' + I('b') + '(' + I('n') + ') = ' + c + I('n') + ' + ' + e + ' gives the value of the ' + I('n') + 'th term of a sequence. What is the sum of the ' + ordinal(i) + ' and ' + ordinal(j) + ' terms of the sequence?',
    hints:['Find each term separately by substituting its position for ' + I('n') + '.',
           'Compute ' + I('b') + '(' + i + ') and ' + I('b') + '(' + j + '), then add them.'],
    explain:I('b') + '(' + i + ') = ' + bi + ' and ' + I('b') + '(' + j + ') = ' + bj + ', so the sum is ' + (bi + bj) + '.'};
}
function qRecursive(r){
  var s = r.int(3, 12), c = r.int(4, 9), n = r.int(40, 90), ans = s + c * (n - 1);
  return {kind:'num', answer:ans, display:String(ans), placeholder:'Type a number',
    prompt:'A sequence is defined by the recursive formula ' + I('f') + '(1) = ' + s + ' and ' + I('f') + '(' + I('n') + ') = ' + I('f') + '(' + I('n') + ' − 1) + ' + c + '. Use an explicit formula to find the ' + ordinal(n) + ' term.',
    hints:['The sequence adds ' + c + ' each time, so ' + c + ' is the common difference.',
           'The explicit formula is ' + I('f') + '(' + I('n') + ') = ' + s + ' + ' + c + '(' + I('n') + ' − 1). Substitute ' + n + ' for ' + I('n') + '.'],
    explain:'The explicit formula is ' + I('f') + '(' + I('n') + ') = ' + s + ' + ' + c + '(' + I('n') + ' − 1). Then ' + I('f') + '(' + n + ') = ' + s + ' + ' + c + '(' + (n - 1) + ') = ' + ans + '.'};
}
function qDonutFind(r){
  var u = r.pick([40, 50, 60, 75, 80]), days = r.int(14, 26), S = u * days, k = r.int(4, days - 4), rem = S - u * k;
  return {kind:'num', answer:k, display:String(k), placeholder:'Type a number of days',
    prompt:'A donut shop owner bought ' + N(S) + ' pounds of flour and uses ' + u + ' pounds each day. Function ' + I('f') + ' gives the pounds remaining after ' + I('d') + ' days: ' + I('f') + '(' + I('d') + ') = ' + N(S) + ' − ' + u + I('d') + '. Find ' + I('d') + ' when ' + I('f') + '(' + I('d') + ') = ' + N(rem) + '.',
    hints:['Set the rule equal to ' + N(rem) + ': ' + N(S) + ' − ' + u + I('d') + ' = ' + N(rem) + '.',
           'Subtract ' + N(S) + ' from both sides, then divide by −' + u + '.'],
    explain:N(S) + ' − ' + u + I('d') + ' = ' + N(rem) + ' gives ' + I('d') + ' = ' + k + '. After ' + k + ' days, ' + N(rem) + ' pounds of flour remain.'};
}

/* ---------- state ---------- */
function fresh(){
  return {screen:'start', name:'', sec:0, alarms:0, helps:0, doorTries:0, rooms:{}, curRoom:null, finalSec:0, finishedOn:''};
}
function load(){
  try{
    var raw = localStorage.getItem(KEY); if(!raw) return null;
    var s = JSON.parse(raw);
    if(!s || typeof s !== 'object' || typeof s.rooms !== 'object') return null;
    return Object.assign(fresh(), s);
  }catch(e){ return null; }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
var S = load() || fresh();
var cur = {room:null, resp:null, fb:null, solved:false, solvedIdx:0, armed:false};

function roomById(id){ for(var i = 0; i < ROOMS.length; i++) if(ROOMS[i].id === id) return ROOMS[i]; return null; }
function rstate(room){ return S.rooms[room.id] || (S.rooms[room.id] = {q:{}}); }
function qstate(room, qd){
  var rs = rstate(room);
  return rs.q[qd.id] || (rs.q[qd.id] = {seed:Math.floor(Math.random() * 2147483647), status:'open', attempts:0, helped:false});
}
function build(room, qd){ return qd.gen(R(qstate(room, qd).seed)); }
function doneCount(room){ var n = 0; room.qs.forEach(function(qd){ if(qstate(room, qd).status === 'done') n++; }); return n; }
function roomDone(room){ return doneCount(room) === room.qs.length; }
function allDone(){ return ROOMS.every(roomDone); }
function firstOpen(room){ for(var i = 0; i < room.qs.length; i++) if(qstate(room, room.qs[i]).status !== 'done') return i; return -1; }

function isCorrect(q, resp){
  if(q.kind === 'mc') return resp === q.correct;
  if(q.kind === 'multi'){ return resp.slice().sort().join(',') === q.correct.slice().sort().join(','); }
  if(q.kind === 'num'){ var v = parseNum(resp); return v !== null && Math.abs(v - q.answer) < 1e-6; }
  if(q.kind === 'text'){ return q.accept.indexOf(normText(resp)) >= 0; }
  return false;
}
function labelOf(q, id){ for(var i = 0; i < q.options.length; i++) if(q.options[i].id === id) return q.options[i].label; return ''; }
function answerText(q){
  if(q.kind === 'mc') return labelOf(q, q.correct);
  if(q.kind === 'multi') return q.correct.map(function(id){ return labelOf(q, id); }).join('; ');
  return q.display;
}
function stars(){
  if(S.helps === 0 && S.alarms <= 6) return 3;
  if(S.helps <= 2 && S.alarms <= 14) return 2;
  return 1;
}

/* ---------- views ---------- */
function keypadHTML(note){
  var h = '<div class="keypad"><p>' + note + '</p><div class="slots" role="img" aria-label="Exit code: ' +
    ROOMS.map(function(rm, i){ return roomDone(rm) ? CONFIG.CODE[i] : 'locked'; }).join(', ') + '">';
  ROOMS.forEach(function(rm, i){
    var on = roomDone(rm);
    h += '<div class="slot' + (on ? ' on' : '') + '">' + (on ? CONFIG.CODE[i] : '?') + '</div>';
  });
  return h + '</div></div>';
}
function segsHTML(room, currentIdx){
  var h = '<ol class="segs" aria-hidden="true">';
  room.qs.forEach(function(qd, i){
    var st = qstate(room, qd).status === 'done';
    h += '<li class="' + (st ? 'd' : (i === currentIdx ? 'c' : '')) + '"></li>';
  });
  return h + '</ol>';
}

function startHTML(){
  var started = S.sec > 0 || Object.keys(S.rooms).length > 0;
  var h = '<section class="hero"><h1 id="heading" tabindex="-1">Lockdown at the Whitewater Center</h1>' +
    '<p class="sub">A Unit 5 escape room for Math 1: Functions</p>' +
    keypadHTML('Five rooms. Five digits. One exit.') +
    '<p class="story">It’s after closing and the control building just locked down. The exit door needs a five-digit code, and each of the five rooms holds one digit. Every lock opens only when you can think like a function. Crack all five rooms, enter the code, and get out before the morning shift shows up.</p>' +
    '<ul class="rules"><li>Visit the rooms in any order. Finish a room to reveal its digit.</li>' +
    '<li>A wrong answer sets off an alarm and gives you a hint. Fewer alarms and no peeking at answers earns more stars.</li>' +
    '<li>Numbers change each time you play, so work every problem yourself.</li></ul>';

    h += '<div class="row"><button class="btn primary" data-act="continue">Continue where I left off</button>' +

  } else {
    h += '<form class="start-form" data-form="begin"><label for="nm">Your name</label>' +
         '<input class="txt" id="nm" maxlength="40" autocomplete="off" value="' + esc(S.name) + '">' +

}
function hubHTML(){
  var ready = allDone();

    '<p>' + (ready ? 'All five digits are in. Head to the exit door.' : 'Each room you crack lights up one digit of the exit code.') + '</p></div>' +
    keypadHTML(ready ? 'Code complete.' : 'Exit code') + '<div class="rooms">';
  ROOMS.forEach(function(rm, i){
    var dc = doneCount(rm), done = dc === rm.qs.length, label = done ? 'Review' : (dc ? 'Continue' : 'Enter room');
    h += '<article class="room' + (done ? ' done' : '') + '"><h3>' + rm.name + '</h3><p class="topic">' + rm.topic + '</p>' +
      segsHTML(rm, firstOpen(rm)) +

      (done ? 'Cracked: digit ' + (i + 1) + ' is ' + CONFIG.CODE[i] : dc + ' of ' + rm.qs.length + ' solved') + '</span>' +
      '<button class="btn' + (done ? '' : ' primary') + '" data-act="enter" data-room="' + rm.id + '">' + label + '</button></div></article>';
  });
  h += '</div><div class="panel door-card"><div><h3>The exit door</h3><p>' +
       (ready ? 'Type the five digits in order.' : 'Locked until all five rooms are cracked.') + '</p></div>' +
       '<button class="btn primary" data-act="door"' + (ready ? '' : ' disabled') + '>Go to the door</button></div>';
  return h;
}
function figHTML(q){
  if(!q.fig) return '';
  var f = FIG[q.fig];
  return '<figure class="fig"><img src="' + f.src + '" alt="' + esc(f.alt) + '"><figcaption>' + esc(f.cap) + '</figcaption></figure>';
}
function inputHTML(q, locked){
  var h = '';
  if(q.kind === 'mc' || q.kind === 'multi'){
    var type = q.kind === 'mc' ? 'radio' : 'checkbox';
    h += '<fieldset><legend class="sr">' + (q.kind === 'mc' ? 'Choose one answer' : 'Select all that apply') + '</legend>';
    if(q.kind === 'multi') h += '<p class="hintline">Select all that apply.</p>';
    q.options.forEach(function(o){
      var checked = q.kind === 'mc' ? cur.resp === o.id : (Array.isArray(cur.resp) && cur.resp.indexOf(o.id) >= 0);
      var right = locked && (q.kind === 'mc' ? q.correct === o.id : q.correct.indexOf(o.id) >= 0);
      h += '<label class="opt' + (right ? ' right' : '') + (locked ? ' disabled' : '') + '"><input type="' + type + '" name="ans" value="' + o.id + '"' +
           (checked || right ? ' checked' : '') + (locked ? ' disabled' : '') + '><span>' + esc(o.label) + '</span></label>';
    });
    h += '</fieldset>';
  } else {
    h += '<div class="answer-input"><label for="ans">Your answer</label><input class="txt" id="ans" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="' +
         (q.kind === 'num' ? 'decimal' : 'text') + '" placeholder="' + esc(q.placeholder || '') + '" value="' + esc(cur.resp || '') + '"' + (locked ? ' disabled' : '') + '></div>';
  }
  return h;
}
function feedbackHTML(q, st){
  var fb = cur.fb; if(!fb) return '';
  if(fb.type === 'nudge') return '<div class="fb nudge"><p>Choose or type an answer first.</p></div>';
  if(fb.type === 'good') return '<div class="fb good"><strong class="t">Correct.</strong><p>' + q.explain + '</p></div>';
  if(fb.type === 'reveal') return '<div class="fb reveal"><strong class="t">Here’s the answer.</strong><p>' + q.explain + '</p></div>';
  var n = st.attempts, h = '<div class="fb bad"><strong class="t">Alarm! Not quite.</strong>';
  if(n === 1) h += '<p>Check your work and try again.</p>';
  else if(n === 2) h += '<p><strong>Hint:</strong> ' + q.hints[0] + '</p>';
  else h += '<p><strong>Hint:</strong> ' + q.hints[1] + '</p><p>Still stuck? You can reveal the answer, but it will cost you stars.</p>';
  return h + '</div>';
}
function roomHTML(){
  var room = roomById(cur.room), idx = ROOMS.indexOf(room);
  var qi = cur.solved ? cur.solvedIdx : firstOpen(room);
  if(qi < 0) return crackedHTML(room, idx);
  var qd = room.qs[qi], st = qstate(room, qd), q = build(room, qd), locked = cur.solved;
  var last = qi === room.qs.length - 1;

  } else {

function escapedHTML(){
  var st = stars(), s = '';
  for(var i = 0; i < 3; i++) s += i < st ? '\u2605' : '\u2606';
  return '<div class="door"><div class="cert"><h2 id="heading" tabindex="-1">You’re out.</h2>' +
    '<div class="who">' + esc(S.name || 'Escapee') + ' escaped the Whitewater Center</div>' +
    '<div class="stars" role="img" aria-label="' + st + ' out of 3 stars">' + s + '</div>' +
    '<dl><div><dt>Time</dt><dd>' + mmss(S.finalSec) + '</dd></div><div><dt>Alarms</dt><dd>' + S.alarms + '</dd></div><div><dt>Answers revealed</dt><dd>' + S.helps + '</dd></div><div><dt>Date</dt><dd>' + esc(S.finishedOn) + '</dd></div></dl>' +
    '<p>Take a screenshot or show this screen to your teacher.</p></div>' +
    '<div class="row"><button class="btn" data-act="replay">' + (cur.armed ? 'Click again to erase this run' : 'Play again with new numbers') + '</button></div></div>';
}

/* ---------- render ---------- */
var lastScreenKey = '';
function render(focusMode){
  var v = $('#view'), scr = S.screen;
  if(scr === 'room' && !roomById(cur.room)) { S.screen = scr = 'hub'; }
  var html = scr === 'start' ? startHTML() : scr === 'hub' ? hubHTML() : scr === 'room' ? roomHTML() : scr === 'door' ? doorHTML(cur.doorMsg) : escapedHTML();
  v.innerHTML = html;
  var playing = scr === 'hub' || scr === 'room' || scr === 'door';
  $('#hud').hidden = !(playing || scr === 'escaped');
  $('#btnMap').hidden = !(scr === 'room' || scr === 'door');
  updateHud();
  var key = scr + ':' + (scr === 'room' ? cur.room + (cur.solved ? 's' + cur.solvedIdx : '') + (firstOpen(roomById(cur.room) || ROOMS[0])) : '');
  if(key !== lastScreenKey){
    lastScreenKey = key;
    var hd = $('#heading'); if(hd){ hd.focus({preventScroll:true}); }
    window.scrollTo(0, 0);
  }
  if(focusMode === 'input'){ var a = $('#ans'); if(a){ a.focus(); var l = a.value.length; try{ a.setSelectionRange(l, l); }catch(e){} } }
  if(focusMode === 'next'){ var nb = $('#nextBtn'); if(nb) nb.focus(); }
}
function updateHud(){
  $('#clock').textContent = mmss(S.sec);
  $('#alarms').textContent = S.alarms;
}

/* ---------- actions ---------- */
function go(screen){ S.screen = screen; cur.doorMsg = ''; save(); render(); }
function enterRoom(id){
  cur.room = id; cur.resp = null; cur.fb = null; cur.solved = false; S.curRoom = id;
  go('room');
}
function doCheck(){
  var room = roomById(cur.room), qi = firstOpen(room);
  if(qi < 0) return;
  var qd = room.qs[qi], st = qstate(room, qd), q = build(room, qd);
  var empty = cur.resp === null || cur.resp === '' || (Array.isArray(cur.resp) && !cur.resp.length) || (typeof cur.resp === 'string' && !cur.resp.trim());
  if(empty){ cur.fb = {type:'nudge'}; render(q.kind === 'num' || q.kind === 'text' ? 'input' : null); return; }
  st.attempts++;
  if(isCorrect(q, cur.resp)){ st.status = 'done'; cur.solved = true; cur.solvedIdx = qi; cur.fb = {type:'good'}; save(); render('next'); }
  else { S.alarms++; cur.fb = {type:'bad'}; save(); render(q.kind === 'num' || q.kind === 'text' ? 'input' : null); }
}
function doReveal(){
  var room = roomById(cur.room), qi = firstOpen(room);
  if(qi < 0) return;
  var qd = room.qs[qi], st = qstate(room, qd);
  st.status = 'done'; st.helped = true; S.helps++;
  cur.solved = true; cur.solvedIdx = qi; cur.fb = {type:'reveal'};
  save(); render('next');
}
function doNext(){ cur.solved = false; cur.resp = null; cur.fb = null; render(); }
function tryDoor(code){
  var want = CONFIG.CODE.join('');
  if(code === want){
    S.screen = 'escaped'; S.finalSec = S.sec; S.finishedOn = new Date().toLocaleDateString('en-US'); save(); render();
  } else {
    S.alarms++; S.doorTries++;
    cur.doorMsg = /^\d{5}$/.test(code) ? 'That code did not work. Check the digits on your keypad and the order of the rooms.' : 'Enter all five digits.';
    save(); render();
    var c = $('#code'); if(c){ c.value = code; c.focus(); }
  }
}
function resetAll(keepName){
  var nm = keepName ? S.name : '';
  S = fresh(); S.name = nm; cur = {room:null, resp:null, fb:null, solved:false, solvedIdx:0, armed:false};
  lastScreenKey = ''; save(); render();
}

/* ---------- events ---------- */
var view = $('#view');
view.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  var a = b.dataset.act;
  if(a === 'continue'){ go(S.curRoom && S.screen === 'room' ? 'room' : 'hub'); }
  else if(a === 'restart'){
    if(cur.armed){ resetAll(true); } else { cur.armed = true; render(); setTimeout(function(){ cur.armed = false; if(S.screen === 'start') render(); }, 3500); }
  }
  else if(a === 'enter') enterRoom(b.dataset.room);
  else if(a === 'check') doCheck();
  else if(a === 'reveal') doReveal();
  else if(a === 'next') doNext();
  else if(a === 'hub') go('hub');
  else if(a === 'door') go('door');
  else if(a === 'replay'){
    if(cur.armed){ resetAll(true); } else { cur.armed = true; render(); setTimeout(function(){ cur.armed = false; if(S.screen === 'escaped') render(); }, 3500); }
  }
});
view.addEventListener('change', function(e){
  var t = e.target; if(t.name !== 'ans') return;
  if(t.type === 'radio'){ cur.resp = t.value; }
  else if(t.type === 'checkbox'){
    var arr = Array.isArray(cur.resp) ? cur.resp.slice() : [];
    var i = arr.indexOf(t.value);
    if(t.checked && i < 0) arr.push(t.value);
    if(!t.checked && i >= 0) arr.splice(i, 1);
    cur.resp = arr;
  }
});
view.addEventListener('input', function(e){ if(e.target.id === 'ans') cur.resp = e.target.value; });
view.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && e.target.id === 'ans'){ e.preventDefault(); doCheck(); }
});
view.addEventListener('submit', function(e){
  var f = e.target.dataset.form; if(!f) return;
  e.preventDefault();
  if(f === 'begin'){
    S.name = ($('#nm').value || '').trim(); S.screen = 'hub'; S.sec = 0; save(); render();
  } else if(f === 'door'){
    tryDoor(($('#code').value || '').replace(/\D/g, ''));
  }
});
$('#btnMap').addEventListener('click', function(){ go('hub'); });

setInterval(function(){
  if(document.hidden) return;
  if(S.screen === 'hub' || S.screen === 'room' || S.screen === 'door'){
    S.sec++; $('#clock').textContent = mmss(S.sec);
    if(S.sec % 10 === 0) save();
  }
}, 1000);

if(window.__TEST__){ window.__t = {R:R, ROOMS:ROOMS, S:function(){ return S; }, build:build, answerText:answerText, CONFIG:CONFIG, cur:function(){ return cur; }}; }

if(S.screen === 'room'){ cur.room = S.curRoom; }
render();
})();
</script>
</body>
</html>
